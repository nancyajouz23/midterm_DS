# Load balancer in front of the gateway instances.
# Requests are spread round-robin; an instance that fails is skipped
# (max_fails/fail_timeout) and the request is retried on the other one.

# Docker's DNS: gateway names are re-resolved, so nginx starts even if a
# gateway is not up yet and follows containers that are recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream gateways {
    zone gateways 64k;
    server gateway-1:8020 resolve max_fails=2 fail_timeout=10s;
    server gateway-2:8020 resolve max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;

    client_max_body_size 2048m;

    location / {
        proxy_pass http://gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Stream large uploads/downloads instead of buffering them.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Try the other gateway if one is down. A stopped container does
        # not refuse connections, it just never answers: give up on it
        # after 1 s and retry on the other instance.
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location = /lb-health {
        return 200 "ok\n";
    }
}
