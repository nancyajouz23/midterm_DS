# Routes PostgreSQL connections to whichever Patroni member is the
# current leader. Patroni's REST API answers 200 on /primary only on the
# leader, so after a failover HAProxy switches to the new leader within
# a few seconds and the services keep working without reconfiguration.
global
    maxconn 300

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

defaults
    mode tcp
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

listen postgres_leader
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg1 pg1:5432 maxconn 100 check port 8008
    server pg2 pg2:5432 maxconn 100 check port 8008
    server pg3 pg3:5432 maxconn 100 check port 8008
