# Distributed object storage - local deployment with Docker Compose.
#
#   docker compose -f compose.storage.yaml --env-file .env up -d --build
#
# Add an 8th storage node (triggers rebalancing):
#   docker compose -f compose.storage.yaml --env-file .env --profile scale-out up -d storage-node-8
#
# Ports on the host:
#   8020  API (nginx load balancer -> gateway-1, gateway-2)
#   3000  Web UI                     3001  Grafana
#   9090  Prometheus                 15672 RabbitMQ management
#   7000  HAProxy stats (PostgreSQL leader routing)
#   8001-8008 storage nodes          8010  metadata service

x-storage-node: &storage-node
  build:
    context: .
    dockerfile: storage_node/Dockerfile
  restart: unless-stopped
  depends_on:
    - metadata

x-gateway: &gateway
  build:
    context: .
    dockerfile: gateway/Dockerfile
  environment:
    METADATA_URL: http://metadata:8010
    DATABASE_URL: postgresql://ds_user:${POSTGRES_PASSWORD}@pg-haproxy:5432/ds_storage
    API_KEY: ${GATEWAY_API_KEY}
    RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-60}
    ELASTICSEARCH_URL: http://elasticsearch:9200
    RABBITMQ_URL: amqp://ds:${RABBITMQ_PASSWORD:-ds-rabbit}@rabbitmq:5672/%2F
  depends_on:
    - metadata
    - rabbitmq
  restart: unless-stopped

x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.17
  restart: unless-stopped

x-patroni: &patroni
  build:
    context: .
    dockerfile: patroni/Dockerfile
  restart: unless-stopped
  depends_on:
    - etcd1
    - etcd2
    - etcd3

x-patroni-env: &patroni-env
  PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
  PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
  PATRONI_REPLICATION_PASSWORD: ${POSTGRES_PASSWORD}
  APP_DB_PASSWORD: ${POSTGRES_PASSWORD}

services:

  # ---------------------------------------------------------------
  # Metadata store: replicated PostgreSQL (no single point of failure)
  #   3-member etcd cluster  -> leader election / cluster state
  #   3 Patroni members      -> 1 leader + 2 streaming replicas
  #   HAProxy                -> always routes to the current leader
  # ---------------------------------------------------------------

  etcd1:
    <<: *etcd
    command: >
      etcd --name etcd1 --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd1:2379
      --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd1:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-state new --initial-cluster-token ds-etcd
    volumes:
      - etcd1-data:/etcd-data

  etcd2:
    <<: *etcd
    command: >
      etcd --name etcd2 --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd2:2379
      --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd2:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-state new --initial-cluster-token ds-etcd
    volumes:
      - etcd2-data:/etcd-data

  etcd3:
    <<: *etcd
    command: >
      etcd --name etcd3 --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd3:2379
      --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd3:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-state new --initial-cluster-token ds-etcd
    volumes:
      - etcd3-data:/etcd-data

  pg1:
    <<: *patroni
    container_name: pg1
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg1:5432
    volumes:
      - pg1-data:/var/lib/postgresql/patroni

  pg2:
    <<: *patroni
    container_name: pg2
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg2:5432
    volumes:
      - pg2-data:/var/lib/postgresql/patroni

  pg3:
    <<: *patroni
    container_name: pg3
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg3
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg3:5432
    volumes:
      - pg3-data:/var/lib/postgresql/patroni

  pg-haproxy:
    image: haproxy:2.9-alpine
    volumes:
      - ./patroni/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "7000:7000"
    depends_on:
      - pg1
      - pg2
      - pg3
    restart: unless-stopped

  metadata:
    build:
      context: .
      dockerfile: metadata_service/Dockerfile
    ports:
      - "8010:8010"
    environment:
      DATABASE_URL: postgresql://ds_user:${POSTGRES_PASSWORD}@pg-haproxy:5432/ds_storage
    depends_on:
      - pg-haproxy
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Storage nodes (each with its own volume)
  # ---------------------------------------------------------------

  storage-node-1:
    <<: *storage-node
    container_name: storage-node-1
    ports: ["8001:8000"]
    environment: {NODE_ID: node1, NODE_URL: "http://storage-node-1:8000", STORAGE_DIR: /data, METADATA_URL: "http://metadata:8010"}
    volumes: [node1-data:/data]

  storage-node-2:
    <<: *storage-node
    container_name: storage-node-2
    ports: ["8002:8000"]
    environment: {NODE_ID: node2, NODE_URL: "http://storage-node-2:8000", STORAGE_DIR: /data, METADATA_URL: "http://metadata:8010"}
    volumes: [node2-data:/data]

  storage-node-3:
    <<: *storage-node
    container_name: storage-node-3
    ports: ["8003:8000"]
    environment: {NODE_ID: node3, NODE_URL: "http://storage-node-3:8000", STORAGE_DIR: /data, METADATA_URL: "http://metadata:8010"}
    volumes: [node3-data:/data]

  storage-node-4:
    <<: *storage-node
    container_name: storage-node-4
    ports: ["8004:8000"]
    environment: {NODE_ID: node4, NODE_URL: "http://storage-node-4:8000", STORAGE_DIR: /data, METADATA_URL: "http://metadata:8010"}
    volumes: [node4-data:/data]

  storage-node-5:
    <<: *storage-node
    container_name: storage-node-5
    ports: ["8005:8000"]
    environment: {NODE_ID: node5, NODE_URL: "http://storage-node-5:8000", STORAGE_DIR: /data, METADATA_URL: "http://metadata:8010"}
    volumes: [node5-data:/data]

  storage-node-6:
    <<: *storage-node
    container_name: storage-node-6
    ports: ["8006:8000"]
    environment: {NODE_ID: node6, NODE_URL: "http://storage-node-6:8000", STORAGE_DIR: /data, METADATA_URL: "http://metadata:8010"}
    volumes: [node6-data:/data]

  # 7th node: erasure coding uses 6 shards (4+2), so a spare node is
  # needed to rebuild a shard when one of the 6 holders fails.
  storage-node-7:
    <<: *storage-node
    container_name: storage-node-7
    ports: ["8007:8000"]
    environment: {NODE_ID: node7, NODE_URL: "http://storage-node-7:8000", STORAGE_DIR: /data, METADATA_URL: "http://metadata:8010"}
    volumes: [node7-data:/data]

  # Started only on demand (profile scale-out) to show that adding a
  # node triggers rebalancing of chunks onto it.
  storage-node-8:
    <<: *storage-node
    container_name: storage-node-8
    profiles: [scale-out]
    ports: ["8008:8000"]
    environment: {NODE_ID: node8, NODE_URL: "http://storage-node-8:8000", STORAGE_DIR: /data, METADATA_URL: "http://metadata:8010"}
    volumes: [node8-data:/data]

  # ---------------------------------------------------------------
  # API: two gateway instances behind an nginx load balancer
  # ---------------------------------------------------------------

  gateway-1:
    <<: *gateway
    container_name: gateway-1
    hostname: gateway-1

  gateway-2:
    <<: *gateway
    container_name: gateway-2
    hostname: gateway-2

  gateway-lb:
    image: nginx:1.27-alpine
    volumes:
      - ./lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8020:80"
    depends_on:
      - gateway-1
      - gateway-2
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Job queue: scheduler detects problems, workers fix them
  # ---------------------------------------------------------------

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ds
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ds-rabbit}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  repair-scheduler:
    build:
      context: .
      dockerfile: repair_worker/Dockerfile
    environment:
      ROLE: scheduler
      METADATA_URL: http://metadata:8010
      RABBITMQ_URL: amqp://ds:${RABBITMQ_PASSWORD:-ds-rabbit}@rabbitmq:5672/%2F
      REPAIR_INTERVAL: "10"
      SCRUB_INTERVAL: "30"
    depends_on:
      - metadata
      - rabbitmq
    restart: unless-stopped

  repair-worker:
    build:
      context: .
      dockerfile: repair_worker/Dockerfile
    environment:
      ROLE: worker
      METADATA_URL: http://metadata:8010
      RABBITMQ_URL: amqp://ds:${RABBITMQ_PASSWORD:-ds-rabbit}@rabbitmq:5672/%2F
    deploy:
      replicas: 2
    depends_on:
      - metadata
      - rabbitmq
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Search, UI, monitoring
  # ---------------------------------------------------------------

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  web-ui:
    build:
      context: .
      dockerfile: web-ui/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - gateway-lb
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest   # same image as in Task 1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest   # same image as in Task 1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/storage.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  node1-data:
    external: true
    name: ds-midterm-node1-data
  node2-data:
    external: true
    name: ds-midterm-node2-data
  node3-data:
    external: true
    name: ds-midterm-node3-data
  node4-data:
    external: true
    name: ds-midterm-node4-data
  node5-data:
    external: true
    name: ds-midterm-node5-data
  node6-data:
    external: true
    name: ds-midterm-node6-data
  node7-data:
  node8-data:
  etcd1-data:
  etcd2-data:
  etcd3-data:
  pg1-data:
  pg2-data:
  pg3-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
