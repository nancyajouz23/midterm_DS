apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: ds-storage
spec:
  selector: {app: elasticsearch}
  ports:
    - port: 9200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: ds-storage
spec:
  replicas: 1
  selector:
    matchLabels: {app: elasticsearch}
  template:
    metadata:
      labels: {app: elasticsearch}
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "false"}
            - {name: ES_JAVA_OPTS, value: "-Xms384m -Xmx384m"}
          ports:
            - containerPort: 9200
          readinessProbe:
            httpGet: {path: /_cluster/health, port: 9200}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 768Mi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-ui-nginx
  namespace: ds-storage
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 2048m;

        location /api/ {
            proxy_pass http://gateway:8030/;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: ds-storage
spec:
  type: LoadBalancer        # Docker Desktop: localhost:3030
  selector: {app: web-ui}
  ports:
    - {port: 3030, targetPort: 80}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: ds-storage
spec:
  replicas: 1
  selector:
    matchLabels: {app: web-ui}
  template:
    metadata:
      labels: {app: web-ui}
    spec:
      containers:
        - name: web-ui
          image: ds-storage/web-ui:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests: {cpu: 20m, memory: 32Mi}
      volumes:
        - name: nginx-conf
          configMap: {name: web-ui-nginx}
