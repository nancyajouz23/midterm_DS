apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: ds-storage
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672}
    - {name: management, port: 15672}
    - {name: metrics, port: 15692}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: ds-storage
spec:
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: ds}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: rabbitmq-secret, key: RABBITMQ_PASSWORD}}
          ports:
            - containerPort: 5672
            - containerPort: 15672
          readinessProbe:
            tcpSocket: {port: 5672}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repair-scheduler
  namespace: ds-storage
spec:
  replicas: 1
  selector:
    matchLabels: {app: repair-scheduler}
  template:
    metadata:
      labels: {app: repair-scheduler}
    spec:
      containers:
        - name: scheduler
          image: ds-storage/repair:1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: ROLE, value: scheduler}
            - {name: METADATA_URL, value: "http://metadata:8010"}
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: rabbitmq-secret, key: RABBITMQ_PASSWORD}}
            - {name: RABBITMQ_URL, value: "amqp://ds:$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F"}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repair-worker
  namespace: ds-storage
spec:
  replicas: 2
  selector:
    matchLabels: {app: repair-worker}
  template:
    metadata:
      labels: {app: repair-worker}
    spec:
      containers:
        - name: worker
          image: ds-storage/repair:1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: ROLE, value: worker}
            - {name: METADATA_URL, value: "http://metadata:8010"}
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: rabbitmq-secret, key: RABBITMQ_PASSWORD}}
            - {name: RABBITMQ_URL, value: "amqp://ds:$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F"}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
